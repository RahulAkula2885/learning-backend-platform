services:

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: learning
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: learning:1.0
    ports:
      - "9090:9090"
    environment:
      SERVER_PORT: 9090
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: learning
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      - mysql

volumes:
  mysql-data:

