spring:
  # =========================
  # APPLICATION NAME
  # =========================
  application:
    name: learning-practice-dev

  # =========================
  # DATABASE CONFIG (MySQL)
  # =========================
  datasource:
    # JDBC connection URL
    # NOTE:
    # - localhost works for local runs (IntelliJ / terminal)
    # - use "mysql" instead of localhost when running inside Docker Compose
    url: jdbc:mysql://localhost:3306/learning

    # Database credentials (avoid hardcoding in production)
    username: root
    password: ${DB_PASSWORD:password}

    # MySQL JDBC driver
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =========================
  # JPA / HIBERNATE CONFIG
  # =========================
  jpa:
    hibernate:
      # Auto schema update based on entities
      # Options:
      #   update   → modifies schema automatically (dev only)
      #   validate → checks schema without changing it (prod recommended)
      #   none     → no schema handling
      ddl-auto: update

      # Prevents naming conversion (camelCase → snake_case)
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    # Logs generated SQL queries
    show-sql: true

    properties:
      hibernate:
        # Formats SQL in logs for readability
        format_sql: true

  # =========================
  # EMAIL CONFIG (SMTP - Gmail)
  # =========================
  mail:
    host: smtp.gmail.com
    port: 587

    # Gmail SMTP credentials
    # NOTE: In production, use environment variables or secret manager
    username: noreplyrahulrao@gmail.com
    password: ${MAIL_PASSWORD:password}

    protocol: smtp

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # =========================
  # FILE UPLOAD CONFIG
  # =========================
  servlet:
    multipart:
      enabled: true

      # Buffer threshold before writing to disk
      file-size-threshold: 2MB

      # Maximum upload file size
      max-file-size: 100MB

      # Maximum request size (all files combined)
      max-request-size: 100MB


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: clientid
            client-secret: clientsecret
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  # =========================
  # Redis cache
  # =========================
#  cache:
#    type: redis
#  data:
#    redis:
#      host: localhost
#      port: 6379



# =========================
# AWS CONFIGURATION (S3 / SDK etc.)
# =========================
cloud:
  aws:
    credentials:
      access-key: abcd
      secret-key: abcd

    region:
      # AWS region where resources are hosted
      static: ap-south-1

    stack:
      # Disables CloudFormation stack auto-detection
      auto: false


# =========================
# SERVER CONFIG
# =========================
server:
  servlet:
    # Base URL path for all APIs
    # Example: http://localhost:8080/dev/api/...
    context-path: /dev


# =========================
# SECURITY CONFIG (JWT)
# =========================
jwt:
  # Secret key used to sign and verify JWT tokens
  # MUST be kept secure in production (use env vars or vault)
  secret: ${JWT_SECRET:secret}


# =========================
# ENCRYPTION CONFIG (AES)
# =========================
aes:
  # Base64 encoded secret key for AES encryption
  secret: ${AES_SECRET:secret}

  # Encryption algorithm used
  algorithm: "AES"




# =========================
# LOGGING CONFIG (OPTIONAL)
# =========================
# Simple file logging (basic use case)
# For advanced logging (rolling logs, daily rotation, size-based logs),
# use logback-spring.xml instead.

# Use this configuration when you want logs to be written to a fixed log file.
# If you need dynamic log files (for example, daily log files with the current date),
# create a logback-spring.xml (or logback.xml) configuration and define the
# rolling policy there.

# logging:
#   level:
#     root: INFO
#   file:
#     name: logs/applicationlogs.log
